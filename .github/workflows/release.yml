name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for AWS OIDC
  contents: write # required to create the tag + GitHub release

# Serialize releases so concurrent runs can't compute the same micro version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need full tag + commit history

      - name: Decide whether to release and compute CalVer
        id: plan
        run: |
          set -euo pipefail

          last_tag=$(git tag --sort=-creatordate | head -n1)
          if [ -n "${last_tag}" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi

          # Release when there is at least one Conventional Commit since the
          # last release. We only care that a commit is semantically formatted,
          # not which type prefix it uses (feat/fix/chore/... all count the
          # same and trigger a single micro bump).
          if git log --no-merges --format='%s' ${range} \
              | grep -qiE '^[a-z]+(\([^)]+\))?!?: '; then
            should_release=true
          else
            should_release=false
          fi

          # CalVer YYYY.MM.Micro; micro is the next counter within this month.
          ym=$(date -u +%Y.%m)
          last=$(git tag --list "${ym}.*" | sed -E "s/^${ym}\.//" | sort -n | tail -n1)
          micro=$(( ${last:--1} + 1 ))
          version="${ym}.${micro}"

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release} version=${version} (range ${range})"

  release:
    name: Publish splinter.json
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: set up python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: verify splinter.sql is up to date
        run: |
          python bin/compile.py
          git diff --exit-code splinter.sql

      - name: generate splinter.json
        run: python bin/compile_json.py --version "${{ needs.plan.outputs.version }}" --output splinter.json

      - name: publish github release (creates the tag)
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          files: splinter.json
          generate_release_notes: true

      # Mirrors the supautils release: OIDC jump role, then chain into the
      # shared-services destination role, then upload to the internal bucket.
      - name: GitHub OIDC auth
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ secrets.SHARED_SERVICES_OIDC }}
          role-session-name: shared-services-jump

      - name: Assume destination role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ secrets.SHARED_SERVICES_ROLE }}
          role-skip-session-tagging: true
          role-session-name: upload-assets
          role-chaining: true

      - name: Upload splinter.json to shared services bucket
        run: |
          aws s3 cp --no-progress splinter.json \
            "s3://${{ secrets.SHARED_SERVICES_BUCKET }}/splinter/${{ needs.plan.outputs.version }}/splinter.json"
