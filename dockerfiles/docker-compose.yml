version: '3'
services:

  test:
    container_name: supabase-db
    build:
        context: ..
        dockerfile: ./dockerfiles/Dockerfile
        args:
          SUPABASE_VERSION: ${SUPABASE_VERSION:-15.14.1.169}
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ../results:/home/splinter/results_out
    command:
      - bash
      - -c
      # Copy the artifacts out whether or not the suite passed, then exit with
      # installcheck's status.
      - |
        ./bin/installcheck
        status=$$?
        cp /home/splinter/regression.diffs \
           /home/splinter/regression.out \
           /home/splinter/results/* \
           /home/splinter/results_out/ 2>/dev/null || true
        exit $$status
